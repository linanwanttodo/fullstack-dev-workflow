name: package skill

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  package:
    name: Package fdw skill
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Package skill into zip
        run: |
          cd .agents/skills
          zip -r fdw.zip fdw

      - name: Verify zip contents
        run: |
          unzip -l fdw.zip | head -20
          unzip -l fdw.zip | grep -q "fdw/SKILL.md" || { echo "SKILL.md missing in zip"; exit 1; }
          unzip -l fdw.zip | grep -q "fdw/references/entry.md" || { echo "references/entry.md missing in zip"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdw-skill
          path: .agents/skills/fdw.zip
          if-no-files-found: error

  release:
    name: Create release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fdw-skill
          path: .

      - name: Create release with zip
        uses: softprops/action-gh-release@v2
        with:
          files: fdw.zip
          generate_release_notes: true